server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:4200"
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - X-Correlation-Id
                  - X-Requested-With
                  - Accept
                  - Origin
                exposedHeaders:
                  - X-Correlation-Id
                  - X-RateLimit-Remaining
                  - X-RateLimit-Burst-Capacity
                  - X-RateLimit-Replenish-Rate
                allowCredentials: true
                maxAge: 3600
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      connect-timeout: 2000ms

jwt:
  public-key: |
    -----BEGIN PUBLIC KEY-----
    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqrox1i23hw5LkvExqNHl
    zPrrIyfpeFvj+xC5GRl6rJaI4g8pZNxNgSVzNJj7ZtRkrHUbNoKYs/zj37uB598+
    F1/nqZ6mK8vQoOy1jul+4nGXhQiiU7bc9w1fLtwT/mG478V8KSnjWynoqVy3Uc30
    H1l0sf4d0tn7EFt8Cd+7UDzbeZtgPKCuGoeMEuzmHHPPg1YjTz6K0mFEBiYpkwtm
    5aUSkxG6E73Z4lOgCvjDUyqXuyciMtSOIHdXm21avoun9FQquXtjwkCNDOaZ2bxb
    BEcs1CRn980AEijDU7zJuwpdmJl8c88gdutMP4stSCBzGzegbtNC5MlVyL6xy4D9
    HwIDAQAB
    -----END PUBLIC KEY-----
  issuer: auth-service
  audience: api-gateway

gateway:
  security:
    public-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      - /api/auth/validate
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
      - /fallback/**

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      authServiceCircuitBreaker:
        baseConfig: default
      orderServiceCircuitBreaker:
        baseConfig: default
      productServiceCircuitBreaker:
        baseConfig: default
      adminServiceCircuitBreaker:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      access: READ_ONLY
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.prashant.api_gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"
