server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    lazy-initialization: true
    banner-mode: off
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      server:
        webflux:
          discovery:
            locator:
              enabled: false   # Disable auto-route
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:4200"
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - X-Correlation-Id
                  - X-Requested-With
                  - Accept
                  - Origin
                exposedHeaders:
                  - X-Correlation-Id
                  - X-RateLimit-Remaining
                  - X-RateLimit-Burst-Capacity
                  - X-RateLimit-Replenish-Rate
                allowCredentials: true
                maxAge: 3600
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

# JWT public key is injected per environment via JWT_PUBLIC_KEY. It MUST match
# the auth-service JWT_PRIVATE_KEY pair so the gateway can verify signatures.
jwt:
  public-key: ${JWT_PUBLIC_KEY}
  issuer: auth-service
  audience: api-gateway

gateway:
  security:
    public-paths:
      - /auth-service/login
      - /auth-service/register
      - /auth-service/refresh
      - /auth-service/validate
      # Invite links are shared outside the app, so the register page must be
      # able to confirm a token without being authenticated.
      - /auth-service/invites/validate
      # WebSocket handshake: browsers cannot set custom headers on a WS upgrade,
      # so the JWT is carried inside the STOMP CONNECT frame and validated by
      # chat-service itself (jwt.public-key). REST under /chat-service stays protected.
      - /chat-service/ws/**
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
      - /fallback/**

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      authServiceCircuitBreaker:
        baseConfig: default
      userServiceCircuitBreaker:
        baseConfig: default
      chatServiceCircuitBreaker:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      access: READ_ONLY
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.prashant.api_gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"