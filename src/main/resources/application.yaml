server:
  port: 8080

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      server:
        webflux:
          discovery:
            locator:
              enabled: false   # ← Disable auto-route
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:4200"
                  - "http://localhost:5173"
                  - "null"          # ← for file:// protocol
                  - "file://"       # ← direct file open
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - X-Correlation-Id
                  - X-Requested-With
                  - Accept
                  - Origin
                exposedHeaders:
                  - X-Correlation-Id
                  - X-RateLimit-Remaining
                  - X-RateLimit-Burst-Capacity
                  - X-RateLimit-Replenish-Rate
                allowCredentials: true
                maxAge: 3600
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      connect-timeout: 2000ms

jwt:
  public-key: |
    -----BEGIN PUBLIC KEY-----
    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvBJrujl1NSaDqIpNkxbB
    NT7h1qiUKZLXdGxp2oWteFPwHscm9DgC6LQf0hJzzccYUKs9nilZ6eoWDRIwtUw2
    cwfzbSiUFXSJNqpa0m7x4gF2Z0S3wH8bkyFW10HKqS1iTL0KWgC44Ns33WOVTyEQ
    7TvWgZnLUC9dbVb15KpfIHU/kw+Y2DuGaX41fWptJ23ochHN+xPOQP8BzKwE270v
    DT4fl+m1k8cR0BBUXLOM8YAq9PUkq52htxRo3swtkSPL6Jt90KhDMWDIk8aLQyeg
    YJZqUu5HOk5Jwbm38DtsKbno7EuySWpSYVdCHUOY1s3UM1OONHAWM4LiNd6wT7hJ
    KQIDAQAB
    -----END PUBLIC KEY-----
  issuer: auth-service
  audience: api-gateway

gateway:
  security:
    public-paths:
      - /auth-service/login
      - /auth-service/register
      - /auth-service/refresh
      - /auth-service/validate
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
      - /fallback/**

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      authServiceCircuitBreaker:
        baseConfig: default
      orderServiceCircuitBreaker:
        baseConfig: default
      productServiceCircuitBreaker:
        baseConfig: default
      adminServiceCircuitBreaker:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      access: READ_ONLY
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.prashant.api_gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"
